<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>M4SK</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <canvas id="rec"></canvas>
    <div id="hud">
      <div id="brand">M4SK</div>
      <div id="status">1 / 5 — Start camera</div>
    </div>
    <div id="preview" hidden>
      <img id="preview-img" alt="Selected photo" />
      <div id="preview-meta">
        <span id="preview-label">Cutout ready</span>
        <label id="cutout-wrap">
          Cutout
          <input id="cutout" type="range" min="8" max="80" value="36" />
        </label>
        <label id="cutout-wrap">
          Size
          <input id="size" type="range" min="70" max="180" value="118" />
        </label>
        <label id="cutout-wrap">
          Nudge
          <input id="nudge" type="range" min="-40" max="80" value="38" />
        </label>
        <label id="cutout-wrap">
          Slide
          <input id="slide" type="range" min="-50" max="50" value="0" />
        </label>
      </div>
    </div>
    <div id="library" hidden></div>
    <div id="save-sheet" hidden>
      <video id="save-video" playsinline controls></video>
      <p id="save-hint">Tap Save to Photos, or hold the video and choose Save Video</p>
      <button id="btn-save-photos" class="primary" type="button">Save to Photos</button>
      <button id="btn-save-close" type="button">Done</button>
    </div>
    <div id="dock">
      <button id="btn-cam" class="primary" type="button">1. Start camera</button>
      <div id="photo-btn" class="file-btn locked">
        2. Photos
        <input id="file-photo" type="file" accept="image/*" disabled />
      </div>
      <button id="btn-attach" type="button" disabled>3. Attach</button>
      <button id="btn-lock" type="button" disabled>4. Lock</button>
      <button id="btn-rec" type="button" disabled>5. Record</button>
      <button id="btn-stop" type="button" hidden>Stop & save</button>
    </div>
    <div id="toast" hidden></div>
  </div>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
