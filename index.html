<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>MASKLAB — Face Mask Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <img id="picked" alt="" />
    <canvas id="gl"></canvas>
    <canvas id="rec"></canvas>
    <div id="hud">
      <div id="brand">MASKLAB</div>
      <div id="status">Tap Start camera</div>
    </div>
    <div id="preview" hidden>
      <img id="preview-img" alt="Selected photo" />
      <div id="preview-meta">
        <span id="preview-label">Photo ready</span>
        <label id="cutout-wrap">
          Cutout
          <input id="cutout" type="range" min="0" max="80" value="34" />
        </label>
      </div>
    </div>
    <div id="dock">
      <button id="btn-cam" class="primary" type="button">Start camera</button>
      <div class="file-btn">
        Photos
        <input id="file-photo" type="file" accept="image/*" />
      </div>
      <div class="file-btn">
        3D file
        <input id="file-3d" type="file" accept=".glb,.gltf,.obj,model/gltf-binary,model/gltf+json" />
      </div>
      <button id="btn-demo" type="button">Built-in mask</button>
      <button id="btn-rec" type="button" disabled>Record</button>
      <button id="btn-stop" type="button" hidden>Stop & save</button>
    </div>
    <div id="toast" hidden></div>
  </div>
  <script>
    (function () {
      var photo = document.getElementById("file-photo");
      var picked = document.getElementById("picked");
      var preview = document.getElementById("preview");
      var previewImg = document.getElementById("preview-img");
      var previewLabel = document.getElementById("preview-label");
      var statusEl = document.getElementById("status");
      var toastEl = document.getElementById("toast");
      photo.addEventListener("change", function () {
        var file = photo.files && photo.files[0];
        if (!file) return;
        var url = URL.createObjectURL(file);
        picked.src = url;
        picked.className = "on";
        preview.hidden = false;
        previewImg.src = url;
        previewLabel.textContent = file.name || "Photo selected";
        statusEl.textContent = "Photo selected";
        toastEl.hidden = false;
        toastEl.textContent = "Photo selected";
        setTimeout(function () { toastEl.hidden = true; }, 1600);
      });
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
