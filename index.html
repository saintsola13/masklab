<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>MASKLAB — Face Mask Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <canvas id="rec"></canvas>
    <div id="hud">
      <div id="brand">MASKLAB</div>
      <div id="status">1 / 4 — Start camera</div>
    </div>
    <div id="preview" hidden>
      <img id="preview-img" alt="Selected photo" />
      <div id="preview-meta">
        <span id="preview-label">Cutout on face</span>
        <label id="cutout-wrap">
          Cutout
          <input id="cutout" type="range" min="8" max="80" value="36" />
        </label>
      </div>
    </div>
    <div id="dock">
      <button id="btn-cam" class="primary" type="button">1. Start camera</button>
      <div id="photo-btn" class="file-btn locked">
        2. Photos
        <input id="file-photo" type="file" accept="image/*" disabled />
      </div>
      <button id="btn-rec" type="button" disabled>3. Record</button>
      <button id="btn-stop" type="button" hidden>Stop & save</button>
      <div class="file-btn ghost">
        3D
        <input id="file-3d" type="file" accept=".glb,.gltf,.obj,model/gltf-binary,model/gltf+json" />
      </div>
    </div>
    <div id="toast" hidden></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
